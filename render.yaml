services:
  - type: web
    name: m-dairy
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://m-dairy.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
